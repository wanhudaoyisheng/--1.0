name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: 类型检查 · 测试 · 启动冒烟
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 词钥-server/package-lock.json

      - name: 安装依赖
        run: cd "词钥-server" && npm ci --no-audit --no-fund

      - name: 类型检查
        run: cd "词钥-server" && npm run typecheck

      - name: 单元 + 集成测试
        run: cd "词钥-server" && npm test

      # 部署环境最容易崩在「装完能不能起来」这一步：
      # 沙箱里没编译工具、Node 版本也可能偏低，所以这一步真的把服务拉起来探活。
      - name: 启动冒烟
        run: |
          cd "词钥-server"
          npm run seed
          PORT=3000 node --experimental-sqlite --experimental-strip-types src/server.ts > /tmp/boot.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/health > /dev/null; then
              echo "✓ /health 正常"
              curl -sf http://127.0.0.1:3000/ready
              echo ""
              curl -sf -X POST http://127.0.0.1:3000/api/sessions -H 'content-type: application/json' -d '{}' | head -c 120
              echo ""
              exit 0
            fi
            sleep 1
          done
          echo "✗ 服务未在 30 秒内就绪，启动日志："
          cat /tmp/boot.log
          exit 1
